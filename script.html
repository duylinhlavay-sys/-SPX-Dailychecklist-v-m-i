<script>

 * ✅ Virtual Scrolling for 10,000+ tasks

// ========================
// App State & Configuration
// ========================
const APP = {
    tasks: [],
    currentFilter: 'all',
    STORAGE_KEY: 'dailyChecklist_tasks',
    THEME_KEY: 'dailyChecklist_theme'
};

// ========================
// DOM Elements
// ========================
const DOM = {
    addTaskForm: document.getElementById('addTaskForm'),
    taskInput: document.getElementById('taskInput'),
    tasksList: document.getElementById('tasksList'),
    emptyState: document.getElementById('emptyState'),
    filterTabs: document.querySelectorAll('.filter-tab'),
    clearCompletedBtn: document.getElementById('clearCompleted'),
    darkModeToggle: document.getElementById('darkModeToggle'),
    confettiContainer: document.getElementById('confettiContainer'),
    progressCircle: document.getElementById('progressCircle'),
    stats: {
        total: document.getElementById('totalTasks'),
        completed: document.getElementById('completedTasks'),
        active: document.getElementById('activeTasks'),
        completionRate: document.getElementById('completionRate')
    }
};

// ========================
// Initialization
// ========================
function init() {
    loadTasksFromStorage();
    loadThemeFromStorage();
    setupEventListeners();
    renderTasks();
    updateStats();
    addProgressGradient();
}

// ========================
// Event Listeners
// ========================
function setupEventListeners() {
    // Add task form
    DOM.addTaskForm.addEventListener('submit', handleAddTask);

    // Filter tabs
    DOM.filterTabs.forEach(tab => {
        tab.addEventListener('click', handleFilterChange);
    });

    // Clear completed button
    DOM.clearCompletedBtn.addEventListener('click', handleClearCompleted);

    // Dark mode toggle
    DOM.darkModeToggle.addEventListener('click', toggleDarkMode);

    // Event delegation for task list (prevents XSS + memory leaks)
    DOM.tasksList.addEventListener('change', (e) => {
        if (e.target.classList.contains('task-checkbox')) {
            const taskId = parseInt(e.target.closest('.task-item').dataset.id);
            toggleTaskComplete(taskId);
        }
    });

    DOM.tasksList.addEventListener('click', (e) => {
        if (e.target.closest('[data-action="delete"]')) {
            const taskId = parseInt(e.target.closest('.task-item').dataset.id);
            deleteTask(taskId);
        }
    });

    // Add ripple effect to buttons
    addRippleEffect();
}

// ========================
// Task Management
// ========================
function handleAddTask(e) {
    e.preventDefault();

    const taskText = DOM.taskInput.value.trim();

    // Validation: Check empty
    if (!taskText) {
        showToast('⚠️ Vui lòng nhập nội dung công việc', 'warning');
        DOM.taskInput.focus();
        return;
    }

    // Validation: Check max length (500 characters)
    if (taskText.length > 500) {
        showToast('⚠️ Nội dung quá dài (tối đa 500 ký tự)', 'warning');
        DOM.taskInput.focus();
        return;
    }

    // Validation: Check duplicate active tasks
    const isDuplicate = APP.tasks.some(t =>
        t.text.toLowerCase() === taskText.toLowerCase() && !t.completed
    );

    if (isDuplicate) {
        showToast('⚠️ Công việc này đã tồn tại trong danh sách!', 'warning');
        DOM.taskInput.focus();
        return;
    }

    const newTask = {
        id: Date.now(),
        text: taskText,
        completed: false,
        createdAt: new Date().toISOString()
    };

    APP.tasks.unshift(newTask);
    saveTasksToStorage();
    renderTasks();
    updateStats();

    DOM.taskInput.value = '';
    DOM.taskInput.focus();

    // Success feedback
    playSuccessAnimation();
    showToast('✅ Đã thêm công việc mới!', 'success');
}

function toggleTaskComplete(taskId) {
    const task = APP.tasks.find(t => t.id === taskId);
    if (task) {
        task.completed = !task.completed;

        // Trigger confetti when completing task
        if (task.completed) {
            triggerConfetti();
        }

        saveTasksToStorage();
        renderTasks();
        updateStats();
    }
}

function deleteTask(taskId) {
    const task = APP.tasks.find(t => t.id === taskId);
    if (!task) return;

    if (confirm(`Xóa công việc "${task.text}"?`)) {
        APP.tasks = APP.tasks.filter(t => t.id !== taskId);
        saveTasksToStorage();
        renderTasks();
        updateStats();
    }
}

function handleClearCompleted() {
    const completedCount = APP.tasks.filter(t => t.completed).length;

    if (completedCount === 0) {
        showToast('Không có công việc nào đã hoàn thành!', 'info');
        return;
    }

    if (confirm(`Xóa ${completedCount} công việc đã hoàn thành?`)) {
        APP.tasks = APP.tasks.filter(t => !t.completed);
        saveTasksToStorage();
        renderTasks();
        updateStats();
        showToast('Đã xóa các công việc đã hoàn thành!', 'success');
    }
}

// ========================
// Filter Management
// ========================
function handleFilterChange(e) {
    const filter = e.target.closest('.filter-tab').dataset.filter;

    // Update active tab
    DOM.filterTabs.forEach(tab => tab.classList.remove('active'));
    e.target.closest('.filter-tab').classList.add('active');

    APP.currentFilter = filter;
    renderTasks();
}

function getFilteredTasks() {
    switch (APP.currentFilter) {
        case 'active':
            return APP.tasks.filter(t => !t.completed);
        case 'completed':
            return APP.tasks.filter(t => t.completed);
        default:
            return APP.tasks;
    }
}

// ========================
// Rendering
// ========================
// Note: For larger datasets (>1000 tasks), consider implementing:
// - Virtual scrolling (render only visible items)
// - Incremental rendering (render in batches)
// - Partial updates (update only changed DOM nodes)
function renderTasks() {
    const filteredTasks = getFilteredTasks();

    // Show/hide empty state
    if (filteredTasks.length === 0) {
        DOM.tasksList.innerHTML = '';
        DOM.emptyState.classList.add('show');
        return;
    }

    DOM.emptyState.classList.remove('show');

    // Render without inline event handlers to prevent XSS
    DOM.tasksList.innerHTML = filteredTasks.map(task => `
        <div class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
            <input
                type="checkbox"
                class="task-checkbox"
                ${task.completed ? 'checked' : ''}
                aria-label="Mark task '${escapeHtml(task.text)}' as ${task.completed ? 'incomplete' : 'complete'}"
            >
            <span class="task-text">${escapeHtml(task.text)}</span>
            <div class="task-actions">
                <button class="btn-delete" data-action="delete" aria-label="Delete task '${escapeHtml(task.text)}'">
                    Xóa
                </button>
            </div>
        </div>
    `).join('');
}

function updateStats() {
    const total = APP.tasks.length;
    const completed = APP.tasks.filter(t => t.completed).length;
    const active = total - completed;
    const completionRate = total > 0 ? Math.round((completed / total) * 100) : 0;

    // Animate numbers
    animateNumber(DOM.stats.total, parseInt(DOM.stats.total.textContent) || 0, total);
    animateNumber(DOM.stats.completed, parseInt(DOM.stats.completed.textContent) || 0, completed);
    animateNumber(DOM.stats.active, parseInt(DOM.stats.active.textContent) || 0, active);
    animateNumber(DOM.stats.completionRate, parseInt(DOM.stats.completionRate.textContent) || 0, completionRate, '%');

    // Update progress ring
    updateProgressRing(completionRate);
}

// Track animation timers to prevent memory leaks
const animationTimers = new WeakMap();

function animateNumber(element, start, end, suffix = '') {
    // Clear any existing animation for this element
    if (animationTimers.has(element)) {
        clearInterval(animationTimers.get(element));
        animationTimers.delete(element);
    }

    const duration = 500;
    const increment = (end - start) / (duration / 16);
    let current = start;

    const timer = setInterval(() => {
        current += increment;
        if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
            current = end;
            clearInterval(timer);
            animationTimers.delete(element); // Cleanup
        }
        element.textContent = Math.round(current) + suffix;
    }, 16);

    // Store timer reference for cleanup
    animationTimers.set(element, timer);
}

function updateProgressRing(percentage) {
    if (!DOM.progressCircle) return;

    const circumference = 2 * Math.PI * 50; // r = 50
    const offset = circumference - (percentage / 100) * circumference;

    DOM.progressCircle.style.strokeDashoffset = offset;
}

// ========================
// LocalStorage Management
// ========================
let saveTasksTimeout = null;

function saveTasksToStorage() {
    // Debounce saves to prevent excessive writes
    clearTimeout(saveTasksTimeout);
    saveTasksTimeout = setTimeout(() => {
        saveTasksToStorageImmediate();
    }, 300); // 300ms debounce
}

function saveTasksToStorageImmediate() {
    // Immediate save for critical operations
    try {
        clearTimeout(saveTasksTimeout);
        const data = JSON.stringify(APP.tasks);

        // Check data size (warn if > 4MB)
        if (data.length > 4 * 1024 * 1024) {
            showToast('⚠️ Dữ liệu quá lớn! Hãy xóa tasks cũ.', 'warning');
        }

        localStorage.setItem(APP.STORAGE_KEY, data);

    } catch (error) {
        console.error('Error saving to localStorage:', error);

        // Handle quota exceeded error
        if (error.name === 'QuotaExceededError') {
            handleQuotaExceeded();
        } else {
            showToast('Lỗi khi lưu dữ liệu!', 'error');
        }
    }
}

function handleQuotaExceeded() {
    // Auto-cleanup: Remove oldest completed tasks (20%)
    const completedTasks = APP.tasks
        .filter(t => t.completed)
        .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

    const removeCount = Math.max(1, Math.floor(completedTasks.length * 0.2));
    const tasksToRemove = completedTasks.slice(0, removeCount);

    if (tasksToRemove.length === 0) {
        // No completed tasks to remove, export everything
        showToast('❌ Bộ nhớ đầy! Đang tự động export...', 'error');
        exportTasksAsBackup();
        return;
    }

    // Remove old tasks
    APP.tasks = APP.tasks.filter(t => !tasksToRemove.includes(t));

    showToast(`🗑️ Đã tự động xóa ${removeCount} tasks cũ để giải phóng bộ nhớ`, 'warning');

    // Retry save
    try {
        localStorage.setItem(APP.STORAGE_KEY, JSON.stringify(APP.tasks));
        renderTasks();
        updateStats();
    } catch (retryError) {
        // Still failed, export as backup
        showToast('❌ Lỗi nghiêm trọng! Đang export dữ liệu...', 'error');
        exportTasksAsBackup();
    }
}

function exportTasksAsBackup() {
    const dataStr = JSON.stringify(APP.tasks, null, 2);
    const dataBlob = new Blob([dataStr], {type: 'application/json'});
    const url = URL.createObjectURL(dataBlob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `checklist-backup-${new Date().toISOString().slice(0,10)}.json`;
    link.click();
    URL.revokeObjectURL(url);
    showToast('✅ Đã export backup thành công!', 'success');
}

function loadTasksFromStorage() {
    try {
        const stored = localStorage.getItem(APP.STORAGE_KEY);
        if (stored) {
            APP.tasks = JSON.parse(stored);
        }
    } catch (error) {
        console.error('Error loading from localStorage:', error);
        APP.tasks = [];
    }
}

// ========================
// Theme Management
// ========================
function toggleDarkMode() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

    document.documentElement.setAttribute('data-theme', newTheme);

    // Try to save to localStorage
    try {
        localStorage.setItem(APP.THEME_KEY, newTheme);
    } catch (error) {
        console.warn('Could not save theme preference:', error);
    }

    // Add transition effect
    document.body.style.transition = 'background 0.3s ease';
}

function loadThemeFromStorage() {
    try {
        const savedTheme = localStorage.getItem(APP.THEME_KEY);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (prefersDark ? 'dark' : 'light');

        document.documentElement.setAttribute('data-theme', theme);
    } catch (error) {
        // Fallback if localStorage is disabled or unavailable
        console.warn('localStorage unavailable, using system preference');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    }
}

// ========================
// Confetti Animation
// ========================
let activeConfettiCount = 0;
const MAX_CONFETTI = 100;

function triggerConfetti() {
    const colors = ['#667eea', '#764ba2', '#f093fb', '#10b981', '#3b82f6', '#f59e0b', '#ef4444'];
    const confettiCount = 30;

    for (let i = 0; i < confettiCount; i++) {
        createConfetti(colors[Math.floor(Math.random() * colors.length)]);
    }
}

function createConfetti(color) {
    // Limit max confetti for performance
    if (activeConfettiCount >= MAX_CONFETTI) {
        console.warn('Max confetti limit reached, skipping...');
        return;
    }

    activeConfettiCount++;

    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.backgroundColor = color;
    confetti.style.animationDelay = Math.random() * 0.5 + 's';
    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';

    DOM.confettiContainer.appendChild(confetti);

    // Remove after animation
    setTimeout(() => {
        confetti.remove();
        activeConfettiCount--;  // Decrement count
    }, 3500);
}

// ========================
// Progress Gradient SVG
// ========================
function addProgressGradient() {
    // Add SVG gradient definition for progress ring
    const svgNS = "http://www.w3.org/2000/svg";
    const defs = document.createElementNS(svgNS, "defs");
    const gradient = document.createElementNS(svgNS, "linearGradient");

    gradient.setAttribute("id", "progressGradient");
    gradient.setAttribute("x1", "0%");
    gradient.setAttribute("y1", "0%");
    gradient.setAttribute("x2", "100%");
    gradient.setAttribute("y2", "100%");

    const stop1 = document.createElementNS(svgNS, "stop");
    stop1.setAttribute("offset", "0%");
    stop1.setAttribute("style", "stop-color:#667eea");

    const stop2 = document.createElementNS(svgNS, "stop");
    stop2.setAttribute("offset", "100%");
    stop2.setAttribute("style", "stop-color:#764ba2");

    gradient.appendChild(stop1);
    gradient.appendChild(stop2);
    defs.appendChild(gradient);

    const progressSvg = document.querySelector('.progress-ring-svg');
    if (progressSvg) {
        progressSvg.insertBefore(defs, progressSvg.firstChild);
    }
}

// ========================
// Ripple Effect
// ========================
function addRippleEffect() {
    // Use event delegation to support dynamic buttons
    document.addEventListener('click', function(e) {
        const button = e.target.closest('.btn-primary, .btn-clear, .filter-tab, .btn-icon, .btn-delete');
        if (!button) return;

        const ripple = document.createElement('span');
        const rect = button.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = e.clientX - rect.left - size / 2;
        const y = e.clientY - rect.top - size / 2;

        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.classList.add('ripple-effect');

        // Ensure button has position relative for ripple
        button.style.position = 'relative';
        button.style.overflow = 'hidden';

        button.appendChild(ripple);

        setTimeout(() => ripple.remove(), 600);
    });
}

// Add CSS for ripple effect dynamically
const style = document.createElement('style');
style.textContent = `
    .ripple-effect {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
        transform: scale(0);
        animation: ripple 0.6s ease-out;
        pointer-events: none;
    }

    @keyframes ripple {
        to {
            transform: scale(2);
            opacity: 0;
        }
    }
`;
document.head.appendChild(style);

// ========================
// Success Animation
// ========================
function playSuccessAnimation() {
    const input = DOM.taskInput;
    input.style.transform = 'scale(1.05)';
    setTimeout(() => {
        input.style.transform = 'scale(1)';
    }, 200);
}

// ========================
// Toast Notification
// ========================
function showToast(message, type = 'info') {
    const existingToast = document.querySelector('.toast');
    if (existingToast) {
        existingToast.remove();
    }

    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;

    const colors = {
        success: '#10b981',
        error: '#ef4444',
        info: '#3b82f6',
        warning: '#f59e0b'
    };

    toast.style.cssText = `
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        padding: 1rem 1.5rem;
        background: ${colors[type]};
        color: white;
        border-radius: 12px;
        font-weight: 600;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        z-index: 10000;
        animation: slideInRight 0.3s ease;
    `;

    document.body.appendChild(toast);

    setTimeout(() => {
        toast.style.animation = 'slideOutRight 0.3s ease';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// Add toast animations
const toastStyle = document.createElement('style');
toastStyle.textContent = `
    @keyframes slideInRight {
        from {
            transform: translateX(400px);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }

    @keyframes slideOutRight {
        from {
            transform: translateX(0);
            opacity: 1;
        }
        to {
            transform: translateX(400px);
            opacity: 0;
        }
    }
`;
document.head.appendChild(toastStyle);

// ========================
// Utility Functions
// ========================
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ========================
// Keyboard Shortcuts
// ========================
document.addEventListener('keydown', (e) => {
    // Ctrl/Cmd + K to focus input
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        DOM.taskInput.focus();
        DOM.taskInput.select();
    }

    // Escape to clear input
    if (e.key === 'Escape') {
        DOM.taskInput.value = '';
        DOM.taskInput.blur();
    }

    // Ctrl/Cmd + D to toggle dark mode
    if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
        e.preventDefault();
        toggleDarkMode();
    }
});

// ========================
// Auto-save on page unload
// ========================
window.addEventListener('beforeunload', () => {
    saveTasksToStorageImmediate(); // Use immediate save on unload
});

// ========================
// Smooth Scroll
// ========================
document.addEventListener('DOMContentLoaded', () => {
    // Smooth scroll behavior
    document.documentElement.style.scrollBehavior = 'smooth';
});

// ========================
// Performance: Debounce input
// ========================
function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

// ========================
// Celebrate All Complete
// ========================
let checkAllCompleteTimeout = null;
let hasTriggeredCelebration = false;

function checkAllComplete() {
    if (APP.tasks.length > 0 && APP.tasks.every(t => t.completed)) {
        // Only trigger once to prevent spam
        if (hasTriggeredCelebration) return;
        hasTriggeredCelebration = true;

        // Mega confetti celebration
        for (let i = 0; i < 5; i++) {
            setTimeout(() => triggerConfetti(), i * 200);
        }
        showToast('🎉 Chúc mừng! Bạn đã hoàn thành tất cả công việc!', 'success');

        // Reset flag after 3 seconds
        setTimeout(() => {
            hasTriggeredCelebration = false;
        }, 3000);
    } else {
        // Reset flag if not all complete
        hasTriggeredCelebration = false;
    }
}

// Override toggleTaskComplete to check for all complete (with debouncing)
const originalToggleTaskComplete = toggleTaskComplete;
toggleTaskComplete = function(taskId) {
    originalToggleTaskComplete(taskId);

    // Debounce checkAllComplete to prevent race conditions
    clearTimeout(checkAllCompleteTimeout);
    checkAllCompleteTimeout = setTimeout(checkAllComplete, 500);
};

// ========================
// Start the app
// ========================
document.addEventListener('DOMContentLoaded', init);

// ========================
// Global Error Boundary
// ========================
window.addEventListener('error', (event) => {
    console.error('Global error caught:', event.error);

    // Prevent infinite loop
    if (event.error && event.error.message && event.error.message.includes('reload')) {
        return;
    }

    showToast('❌ Đã xảy ra lỗi! Đang tải lại...', 'error');

    // Auto-recovery after 2 seconds
    setTimeout(() => {
        window.location.reload();
    }, 2000);
});

window.addEventListener('unhandledrejection', (event) => {
    console.error('Unhandled promise rejection:', event.reason);
    showToast('❌ Lỗi bất đồng bộ!', 'error');

    // Prevent default to avoid console spam
    event.preventDefault();
});

/* ========================
   Virtual Scrolling Module
   ======================== */
// Virtual Scrolling Implementation for 10,000+ Tasks
// Daily Checklist v2.0 - Performance Optimization

class VirtualScroller {
    constructor(options) {
        this.container = options.container;
        this.itemHeight = options.itemHeight || 80; // Default task height
        this.renderItem = options.renderItem;
        this.items = [];
        this.visibleItems = [];
        this.scrollTop = 0;
        this.containerHeight = 0;
        this.totalHeight = 0;
        this.startIndex = 0;
        this.endIndex = 0;
        this.buffer = options.buffer || 5; // Render 5 extra items above/below

        this.init();
    }

    init() {
        // Create viewport and content container
        this.viewport = document.createElement('div');
        this.viewport.style.cssText = `
            height: 100%;
            overflow-y: auto;
            position: relative;
        `;

        this.content = document.createElement('div');
        this.content.style.cssText = `
            position: relative;
            width: 100%;
        `;

        this.viewport.appendChild(this.content);
        this.container.appendChild(this.viewport);

        // Event listeners
        this.viewport.addEventListener('scroll', () => this.onScroll());
        window.addEventListener('resize', () => this.onResize());

        this.updateDimensions();
    }

    setItems(items) {
        this.items = items;
        this.totalHeight = this.items.length * this.itemHeight;
        this.content.style.height = `${this.totalHeight}px`;
        this.render();
    }

    updateDimensions() {
        this.containerHeight = this.viewport.clientHeight;
        this.visibleCount = Math.ceil(this.containerHeight / this.itemHeight);
        this.render();
    }

    onScroll() {
        this.scrollTop = this.viewport.scrollTop;
        this.render();
    }

    onResize() {
        this.updateDimensions();
    }

    render() {
        // Calculate visible range
        this.startIndex = Math.max(0, Math.floor(this.scrollTop / this.itemHeight) - this.buffer);
        this.endIndex = Math.min(
            this.items.length,
            Math.ceil((this.scrollTop + this.containerHeight) / this.itemHeight) + this.buffer
        );

        // Get visible items
        this.visibleItems = this.items.slice(this.startIndex, this.endIndex);

        // Clear content
        this.content.innerHTML = '';

        // Create offset div
        const offsetTop = this.startIndex * this.itemHeight;
        const offsetDiv = document.createElement('div');
        offsetDiv.style.height = `${offsetTop}px`;
        this.content.appendChild(offsetDiv);

        // Render visible items
        this.visibleItems.forEach((item, index) => {
            const actualIndex = this.startIndex + index;
            const element = this.renderItem(item, actualIndex);
            element.style.height = `${this.itemHeight}px`;
            this.content.appendChild(element);
        });

        // Create bottom spacer
        const bottomSpace = (this.items.length - this.endIndex) * this.itemHeight;
        if (bottomSpace > 0) {
            const bottomDiv = document.createElement('div');
            bottomDiv.style.height = `${bottomSpace}px`;
            this.content.appendChild(bottomDiv);
        }
    }

    scrollToIndex(index) {
        const scrollPosition = index * this.itemHeight;
        this.viewport.scrollTop = scrollPosition;
    }

    scrollToTop() {
        this.viewport.scrollTop = 0;
    }

    destroy() {
        this.viewport.removeEventListener('scroll', this.onScroll);
        window.removeEventListener('resize', this.onResize);
        this.container.innerHTML = '';
    }

    // Get currently visible item indices
    getVisibleRange() {
        return {
            start: this.startIndex,
            end: this.endIndex,
            count: this.endIndex - this.startIndex
        };
    }

    // Update item height dynamically
    setItemHeight(height) {
        this.itemHeight = height;
        this.totalHeight = this.items.length * this.itemHeight;
        this.content.style.height = `${this.totalHeight}px`;
        this.render();
    }
}

// Enhanced renderTasks with Virtual Scrolling
// Add this to app.js to enable virtual scrolling

let virtualScroller = null;
const ENABLE_VIRTUAL_SCROLL = true; // Toggle feature
const VIRTUAL_SCROLL_THRESHOLD = 100; // Enable when > 100 tasks

function renderTasksWithVirtualScroll() {
    const filteredTasks = getFilteredTasks();

    // Show/hide empty state
    if (filteredTasks.length === 0) {
        DOM.tasksList.innerHTML = '';
        DOM.emptyState.classList.add('show');
        if (virtualScroller) {
            virtualScroller.destroy();
            virtualScroller = null;
        }
        return;
    }

    DOM.emptyState.classList.remove('show');

    // Use virtual scrolling for large lists
    if (ENABLE_VIRTUAL_SCROLL && filteredTasks.length > VIRTUAL_SCROLL_THRESHOLD) {
        if (!virtualScroller) {
            // Initialize virtual scroller
            DOM.tasksList.innerHTML = '';
            virtualScroller = new VirtualScroller({
                container: DOM.tasksList,
                itemHeight: 80, // Adjust based on your task item height
                buffer: 5,
                renderItem: (task, index) => {
                    const div = document.createElement('div');
                    div.className = `task-item ${task.completed ? 'completed' : ''}`;
                    div.dataset.id = task.id;
                    div.innerHTML = `
                        <input
                            type="checkbox"
                            class="task-checkbox"
                            ${task.completed ? 'checked' : ''}
                            aria-label="Mark task '${escapeHtml(task.text)}' as ${task.completed ? 'incomplete' : 'complete'}"
                        >
                        <span class="task-text">${escapeHtml(task.text)}</span>
                        <div class="task-actions">
                            <button class="btn-delete" data-action="delete" aria-label="Delete task '${escapeHtml(task.text)}'">
                                Xóa
                            </button>
                        </div>
                    `;
                    return div;
                }
            });
        }

        virtualScroller.setItems(filteredTasks);
        console.log(`✅ Virtual scrolling enabled (${filteredTasks.length} tasks)`);
    } else {
        // Standard rendering for small lists
        if (virtualScroller) {
            virtualScroller.destroy();
            virtualScroller = null;
        }

        DOM.tasksList.innerHTML = filteredTasks.map(task => `
            <div class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
                <input
                    type="checkbox"
                    class="task-checkbox"
                    ${task.completed ? 'checked' : ''}
                    aria-label="Mark task '${escapeHtml(task.text)}' as ${task.completed ? 'incomplete' : 'complete'}"
                >
                <span class="task-text">${escapeHtml(task.text)}</span>
                <div class="task-actions">
                    <button class="btn-delete" data-action="delete" aria-label="Delete task '${escapeHtml(task.text)}'">
                        Xóa
                    </button>
                </div>
            </div>
        `).join('');
    }
}

// Export for use in app.js
if (typeof module !== 'undefined' && module.exports) {
    module.exports = { VirtualScroller, renderTasksWithVirtualScroll };
}

/**
 * Export tasks as JSON for download
 */
function exportTasks() {
    if (APP.tasks.length === 0) {
        showToast('⚠️ Không có công việc nào để xuất', 'warning');
        return;
    }

    const dataStr = JSON.stringify(APP.tasks, null, 2);
    const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);

    const exportFileDefaultName = 'daily-checklist-' + new Date().toISOString().split('T')[0] + '.json';

    const linkElement = document.createElement('a');
    linkElement.setAttribute('href', dataUri);
    linkElement.setAttribute('download', exportFileDefaultName);
    linkElement.click();

    showToast('✅ Đã xuất ' + APP.tasks.length + ' công việc', 'success');
}

/**
 * Backup to Google Drive (using server-side function)
 */
function backupToGoogleDrive() {
    showToast('☁️ Đang sao lưu lên Google Drive...', 'info');

    // Call Google Apps Script server-side function
    if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
            .withSuccessHandler(function(result) {
                if (result.success) {
                    showToast('✅ Đã sao lưu: ' + result.fileName, 'success');
                    console.log('Backup URL:', result.url);
                } else {
                    showToast('❌ Lỗi sao lưu: ' + result.message, 'error');
                }
            })
            .withFailureHandler(function(error) {
                showToast('❌ Lỗi: ' + error.message, 'error');
                console.error('Backup error:', error);
            })
            .saveTasksToCloud(APP.tasks);
    } else {
        // Fallback for testing outside Google Apps Script
        console.log('Google Apps Script not available. Tasks:', APP.tasks);
        showToast('⚠️ Chỉ hoạt động trong Google Apps Script', 'warning');
    }
}

/**
 * Load backup from Google Drive
 */
function loadFromGoogleDrive() {
    showToast('☁️ Đang tải từ Google Drive...', 'info');

    if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
            .withSuccessHandler(function(result) {
                if (result.success && result.tasks.length > 0) {
                    // Merge with existing tasks (avoid duplicates)
                    const existingIds = new Set(APP.tasks.map(function(t) { return t.id; }));
                    const newTasks = result.tasks.filter(function(t) { return !existingIds.has(t.id); });

                    APP.tasks.push.apply(APP.tasks, newTasks);
                    saveTasks();
                    renderTasks();
                    updateStats();

                    showToast('✅ Đã tải ' + newTasks.length + ' công việc mới', 'success');
                } else {
                    showToast('⚠️ ' + result.message, 'warning');
                }
            })
            .withFailureHandler(function(error) {
                showToast('❌ Lỗi: ' + error.message, 'error');
                console.error('Load error:', error);
            })
            .loadTasksFromCloud();
    } else {
        showToast('⚠️ Chỉ hoạt động trong Google Apps Script', 'warning');
    }
}
