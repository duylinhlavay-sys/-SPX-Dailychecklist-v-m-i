<style>
/* ========================
   CSS Variables & Theme
   ======================== */
:root {
    /* Light Mode Colors - Premium Palette */
    --bg-primary: #f8fafc;
    --bg-secondary: #ffffff;
    --bg-gradient-1: #667eea;
    --bg-gradient-2: #764ba2;
    --bg-gradient-3: #f093fb;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --border-color: rgba(148, 163, 184, 0.2);

    /* Shadows - Layered for depth */
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    --shadow-glass: 0 8px 32px rgba(31, 38, 135, 0.15);
    --shadow-colored: 0 20px 60px -10px rgba(102, 126, 234, 0.3);

    /* Accent Colors - Vibrant but refined */
    --color-primary: #667eea;
    --color-primary-dark: #5568d3;
    --color-primary-light: #818cf8;
    --color-success: #10b981;
    --color-success-light: #34d399;
    --color-danger: #ef4444;
    --color-danger-light: #f87171;
    --color-warning: #f59e0b;
    --color-info: #3b82f6;

    /* Glass Effect - Premium layers */
    --glass-bg: rgba(255, 255, 255, 0.75);
    --glass-bg-hover: rgba(255, 255, 255, 0.85);
    --glass-border: rgba(255, 255, 255, 0.5);
    --glass-blur: blur(12px);

    /* Animations */
    --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

[data-theme="dark"] {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-gradient-1: #4338ca;
    --bg-gradient-2: #581c87;
    --bg-gradient-3: #c026d3;
    --text-primary: #f1f5f9;
    --text-secondary: #cbd5e1;
    --text-muted: #64748b;
    --border-color: rgba(148, 163, 184, 0.2);

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
    --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
    --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.4);
    --shadow-colored: 0 20px 60px -10px rgba(67, 56, 202, 0.5);

    --glass-bg: rgba(30, 41, 59, 0.75);
    --glass-bg-hover: rgba(30, 41, 59, 0.85);
    --glass-border: rgba(255, 255, 255, 0.1);
}

/* ========================
   Reset & Base Styles
   ======================== */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
    position: relative;
    overflow-x: hidden;
}

/* ========================
   Animated Background
   ======================== */
.animated-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
}

.gradient-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.6;
    animation: float 20s ease-in-out infinite;
}

.orb-1 {
    width: 500px;
    height: 500px;
    background: var(--bg-gradient-1);
    top: -250px;
    left: -250px;
    animation-delay: 0s;
}

.orb-2 {
    width: 400px;
    height: 400px;
    background: var(--bg-gradient-2);
    bottom: -200px;
    right: -200px;
    animation-delay: 5s;
}

.orb-3 {
    width: 350px;
    height: 350px;
    background: var(--bg-gradient-3);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation-delay: 10s;
}

@keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}

@keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -30px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.9); }
}

/* ========================
   Confetti Animation
   ======================== */
#confettiContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999;
}

.confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    animation: confettiFall 3s ease-out forwards;
}

@keyframes confettiFall {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
    }
}

/* ========================
   App Container
   ======================== */
.app-container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
    min-height: 100vh;
    position: relative;
    z-index: 1;
}

/* ========================
   Header - Premium Design
   ======================== */
.header {
    margin-bottom: 2.5rem;
    animation: slideDownBounce 0.8s var(--bounce);
}

.header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 2px solid var(--glass-border);
    border-radius: 24px;
    padding: 1.75rem 2.5rem;
    box-shadow: var(--shadow-glass), var(--shadow-xl);
    transition: all var(--transition-normal);
}

.header-content:hover {
    box-shadow: var(--shadow-2xl), var(--shadow-colored);
    transform: translateY(-2px);
}

.app-title {
    font-size: 2.25rem;
    font-weight: 800;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 1rem;
    letter-spacing: -0.5px;
}

.app-icon {
    width: 48px;
    height: 48px;
    animation: rotate 3s ease-in-out infinite;
}

@keyframes rotate {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(10deg); }
}

.title-text {
    background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.btn-icon {
    background: var(--glass-bg);
    border: 2px solid var(--glass-border);
    border-radius: 16px;
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all var(--transition-normal);
    position: relative;
    overflow: hidden;
}

.btn-icon::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: var(--color-primary);
    opacity: 0.2;
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

.btn-icon:hover::before {
    width: 200px;
    height: 200px;
}

.btn-icon:hover {
    transform: scale(1.1) rotate(10deg);
    box-shadow: var(--shadow-lg);
    border-color: var(--color-primary-light);
}

.btn-icon:active {
    transform: scale(0.95);
}

.theme-icon {
    width: 28px;
    height: 28px;
    color: var(--text-primary);
    transition: all var(--transition-normal);
    position: relative;
    z-index: 1;
}

.sun-icon {
    display: none;
}

.moon-icon {
    display: block;
}

[data-theme="dark"] .sun-icon {
    display: block;
}

[data-theme="dark"] .moon-icon {
    display: none;
}

/* ========================
   Stats Dashboard - Premium
   ======================== */
.stats-section {
    margin-bottom: 2.5rem;
    animation: fadeInScale 0.8s var(--bounce) 0.2s backwards;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.25rem;
}

.stat-card {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 2px solid var(--glass-border);
    border-radius: 20px;
    padding: 2rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    box-shadow: var(--shadow-glass), var(--shadow-lg);
    transition: all var(--transition-normal);
    position: relative;
    overflow: hidden;
}

.stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, var(--color-primary), transparent);
    opacity: 0;
    transition: opacity var(--transition-normal);
}

.stat-card:hover::before {
    opacity: 0.05;
}

.stat-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: var(--shadow-2xl), var(--shadow-colored);
    border-color: var(--color-primary-light);
}

.stat-icon {
    width: 56px;
    height: 56px;
    color: var(--color-primary);
    flex-shrink: 0;
    transition: all var(--transition-normal);
}

.stat-card:hover .stat-icon {
    transform: scale(1.1) rotate(5deg);
    color: var(--color-primary-light);
}

.stat-content {
    flex: 1;
    position: relative;
    z-index: 1;
}

.stat-value {
    font-size: 2.5rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 0.5rem;
    transition: all var(--transition-normal);
}

.stat-card:hover .stat-value {
    transform: scale(1.05);
}

.stat-label {
    font-size: 0.875rem;
    color: var(--text-secondary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Progress Ring for Completion Rate */
.stat-card-progress {
    flex-direction: column;
    text-align: center;
}

.progress-ring {
    position: relative;
    width: 120px;
    height: 120px;
    margin-bottom: 1rem;
}

.progress-ring-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}

.progress-ring-circle-bg {
    fill: none;
    stroke: var(--border-color);
    stroke-width: 8;
}

.progress-ring-circle {
    fill: none;
    stroke: url(#progressGradient);
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 314;
    stroke-dashoffset: 314;
    transition: stroke-dashoffset 1s var(--bounce);
}

.progress-value {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

/* ========================
   Main Content
   ======================== */
.main-content {
    animation: fadeInUp 0.8s var(--bounce) 0.3s backwards;
}

/* Add Task Section - Premium */
.add-task-section {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 2px solid var(--glass-border);
    border-radius: 24px;
    padding: 2.5rem;
    margin-bottom: 2.5rem;
    box-shadow: var(--shadow-glass), var(--shadow-xl);
    transition: all var(--transition-normal);
}

.add-task-section:hover {
    box-shadow: var(--shadow-2xl);
}

.input-group {
    display: flex;
    gap: 1rem;
    align-items: center;
    position: relative;
}

.input-icon {
    position: absolute;
    left: 1.5rem;
    width: 24px;
    height: 24px;
    color: var(--text-muted);
    pointer-events: none;
    transition: all var(--transition-normal);
    z-index: 1;
}

.task-input:focus ~ .input-icon,
.task-input:not(:placeholder-shown) ~ .input-icon {
    color: var(--color-primary);
    transform: scale(1.1);
}

.task-input {
    flex: 1;
    padding: 1.25rem 1.5rem 1.25rem 4rem;
    font-size: 1.125rem;
    border: 2px solid var(--border-color);
    border-radius: 16px;
    background: var(--bg-secondary);
    color: var(--text-primary);
    transition: all var(--transition-normal);
    outline: none;
    font-weight: 500;
}

.task-input::placeholder {
    color: var(--text-muted);
    font-weight: 400;
}

.task-input:focus {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1), var(--shadow-lg);
    transform: translateY(-2px);
}

.btn-primary {
    padding: 1.25rem 2.5rem;
    background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
    color: white;
    border: none;
    border-radius: 16px;
    font-size: 1.125rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    transition: all var(--transition-normal);
    box-shadow: var(--shadow-lg), 0 10px 30px -10px var(--color-primary);
    position: relative;
    overflow: hidden;
}

.btn-primary::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

.btn-primary:hover::before {
    width: 300px;
    height: 300px;
}

.btn-primary:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: var(--shadow-2xl), 0 20px 40px -10px var(--color-primary);
}

.btn-primary:active {
    transform: translateY(-2px) scale(0.98);
}

.btn-icon-svg {
    width: 24px;
    height: 24px;
    transition: transform var(--transition-normal);
    position: relative;
    z-index: 1;
}

.btn-primary:hover .btn-icon-svg {
    transform: rotate(90deg);
}

.btn-text {
    position: relative;
    z-index: 1;
}

/* Filter Section - Premium */
.filter-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    gap: 1.5rem;
    flex-wrap: wrap;
}

.filter-tabs {
    display: flex;
    gap: 0.75rem;
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 2px solid var(--glass-border);
    padding: 0.5rem;
    border-radius: 16px;
    box-shadow: var(--shadow-md);
}

.filter-tab {
    padding: 0.875rem 1.75rem;
    background: transparent;
    border: none;
    border-radius: 12px;
    color: var(--text-secondary);
    font-weight: 700;
    font-size: 0.9375rem;
    cursor: pointer;
    transition: all var(--transition-normal);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    position: relative;
}

.filter-tab svg {
    width: 18px;
    height: 18px;
    transition: all var(--transition-normal);
}

.filter-tab:hover {
    color: var(--text-primary);
    background: rgba(102, 126, 234, 0.1);
    transform: translateY(-2px);
}

.filter-tab.active {
    background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
    color: white;
    box-shadow: var(--shadow-md), 0 8px 20px -8px var(--color-primary);
}

.filter-tab.active svg {
    transform: scale(1.1);
}

.btn-clear {
    padding: 0.875rem 1.75rem;
    background: var(--color-danger);
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.9375rem;
    cursor: pointer;
    transition: all var(--transition-normal);
    box-shadow: var(--shadow-md), 0 8px 20px -8px var(--color-danger);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.btn-clear svg {
    width: 18px;
    height: 18px;
}

.btn-clear:hover {
    background: var(--color-danger-light);
    transform: translateY(-2px) scale(1.05);
    box-shadow: var(--shadow-lg), 0 12px 30px -10px var(--color-danger);
}

.btn-clear:active {
    transform: translateY(0) scale(0.98);
}

/* Tasks List - Premium */
.tasks-section {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 2px solid var(--glass-border);
    border-radius: 24px;
    padding: 2rem;
    min-height: 400px;
    box-shadow: var(--shadow-glass), var(--shadow-xl);
}

.tasks-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.task-item {
    background: var(--bg-secondary);
    border: 2px solid var(--border-color);
    border-radius: 16px;
    padding: 1.5rem;
    display: flex;
    align-items: center;
    gap: 1.25rem;
    transition: all var(--transition-normal);
    animation: slideInBounce 0.5s var(--bounce);
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
}

.task-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 4px;
    background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
    transform: scaleY(0);
    transition: transform var(--transition-normal);
}

.task-item:hover::before {
    transform: scaleY(1);
}

.task-item:hover {
    border-color: var(--color-primary);
    transform: translateX(8px);
    box-shadow: var(--shadow-lg), 0 10px 30px -10px var(--color-primary);
}

.task-item.completed {
    opacity: 0.65;
    background: var(--glass-bg);
}

.task-item.completed::before {
    background: var(--color-success);
}

.task-item.completed:hover {
    opacity: 0.8;
    border-color: var(--color-success);
}

.task-item.completed .task-text {
    text-decoration: line-through;
    color: var(--text-muted);
}

.task-checkbox {
    width: 28px;
    height: 28px;
    cursor: pointer;
    accent-color: var(--color-success);
    transition: transform var(--transition-fast);
}

.task-checkbox:hover {
    transform: scale(1.2);
}

.task-text {
    flex: 1;
    font-size: 1.0625rem;
    color: var(--text-primary);
    font-weight: 500;
    word-break: break-word;
    line-height: 1.6;
}

.task-actions {
    display: flex;
    gap: 0.5rem;
    opacity: 0;
    transition: opacity var(--transition-normal);
}

.task-item:hover .task-actions {
    opacity: 1;
}

.btn-delete {
    background: var(--color-danger);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0.625rem 1.25rem;
    cursor: pointer;
    font-size: 0.875rem;
    font-weight: 700;
    transition: all var(--transition-normal);
    box-shadow: var(--shadow-sm);
}

.btn-delete:hover {
    background: var(--color-danger-light);
    transform: scale(1.1);
    box-shadow: var(--shadow-md);
}

.btn-delete:active {
    transform: scale(0.95);
}

/* Empty State - Premium */
.empty-state {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
    text-align: center;
}

.empty-state.show {
    display: flex;
    animation: fadeInScale 0.6s var(--bounce);
}

.empty-icon {
    width: 160px;
    height: 160px;
    color: var(--text-muted);
    margin-bottom: 2rem;
    opacity: 0.4;
    animation: floatGentle 3s ease-in-out infinite;
}

@keyframes floatGentle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.empty-state h3 {
    font-size: 1.75rem;
    color: var(--text-primary);
    font-weight: 700;
    margin-bottom: 0.75rem;
}

.empty-state p {
    color: var(--text-secondary);
    font-size: 1.0625rem;
}

/* Footer */
.footer {
    margin-top: 4rem;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9375rem;
    padding: 2rem 1rem;
    font-weight: 500;
}

/* ========================
   Animations - Premium
   ======================== */
@keyframes slideDownBounce {
    0% {
        opacity: 0;
        transform: translateY(-50px);
    }
    60% {
        transform: translateY(10px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeInScale {
    0% {
        opacity: 0;
        transform: scale(0.9);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes fadeInUp {
    0% {
        opacity: 0;
        transform: translateY(40px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes slideInBounce {
    0% {
        opacity: 0;
        transform: translateX(-30px);
    }
    60% {
        transform: translateX(5px);
    }
